name: build-douyu-apk

on:
  workflow_dispatch:
  push:
    tags:
      - "douyu-v*"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 用 GitHub Secret(DOUYU_COOKIE) 注入斗鱼登录 Cookie 到占位文件。
      # 必须写成 Dart 原始字符串 r'''...'''，否则 Cookie 里的 $ 会被当成变量插值导致编译失败。
      # 未配置 Secret 时保留空占位（App 以匿名方式观看斗鱼）。
      - name: Inject Douyu Cookie from Secret
        run: |
          python3 - <<'PY'
          import os
          val = os.environ.get("DOUYU_COOKIE", "").strip()
          path = "simple_live_app/lib/services/douyu_cookie_secret.dart"
          if not val:
              print("DOUYU_COOKIE not set; keep empty placeholder (anonymous).")
          elif "'''" in val or val.endswith("'"):
              raise SystemExit("cookie contains a sequence that breaks r'''...'''")
          else:
              out = ("// Generated by CI from GitHub Secret DOUYU_COOKIE. Do not commit real credentials.\n"
                     "const String kPrefilledDouyuCookie =\n"
                     "    r'''" + val + "''';\n")
              with open(path, "w", encoding="utf-8") as f:
                  f.write(out)
              print("douyu_cookie_secret.dart injected, length=", len(val))
          PY
        env:
          DOUYU_COOKIE: ${{ secrets.DOUYU_COOKIE }}

      - name: Verify injected constant compiles to valid Dart syntax
        run: |
          head -c 120 simple_live_app/lib/services/douyu_cookie_secret.dart; echo
          grep -c 'kPrefilledDouyuCookie' simple_live_app/lib/services/douyu_cookie_secret.dart

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Flutter pub get
        working-directory: simple_live_app
        run: flutter pub get

      # 自愈护栏：某些插件发布版删掉了 kotlin-android 声明却有 .kt 源码，导致 Java 找不到符号。
      # 这里检测并补回，避免同类上游回归再次打断构建。
      - name: Repair Android plugins missing kotlin-android
        run: |
          python3 - <<'RPY'
          import json, os, glob
          if not os.path.isfile('.flutter-plugins-dependencies'):
              print('no plugin manifest; skip repair')
              raise SystemExit(0)
          meta = json.load(open('.flutter-plugins-dependencies'))
          plugins = [a['path'] for a in meta['plugins'].get('android', [])]
          fixed = []
          for base in plugins:
              adir = os.path.join(base, 'android')
              if not os.path.isdir(adir):
                  continue
              has_kt = bool(glob.glob(adir + '/src/**/*.kt', recursive=True))
              if not has_kt:
                  continue
              cands = [adir + '/build.gradle', adir + '/build.gradle.kts']
              gpath = next((c for c in cands if os.path.isfile(c)), None)
              if gpath is None:
                  continue
              txt = open(gpath, encoding='utf-8').read()
              if 'kotlin-android' in txt or 'org.jetbrains.kotlin.android' in txt:
                  continue
              if gpath.endswith('.kts'):
                  patched = txt.replace(
                      "id('com.android.library')",
                      "id('com.android.library')\n    id('org.jetbrains.kotlin.android')",
                      1,
                  )
                  if patched == txt:
                      patched = txt.replace(
                          'id(\"com.android.library\")',
                          'id(\"com.android.library\")\n    id(\"org.jetbrains.kotlin.android\")',
                          1,
                      )
              else:
                  patched = txt.replace(
                      "apply plugin: 'com.android.library'",
                      "apply plugin: 'com.android.library'\napply plugin: 'kotlin-android'",
                      1,
                  )
              if patched != txt:
                  open(gpath, 'w', encoding='utf-8').write(patched)
                  fixed.append(os.path.relpath(gpath))
          print('repaired plugins:', fixed if fixed else 'none needed')
          RPY
        working-directory: simple_live_app

      - name: Build APK (split per ABI)
        working-directory: simple_live_app
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: douyu-apk
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk

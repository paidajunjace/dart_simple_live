name: build-douyu-apk

on:
  workflow_dispatch:
  push:
    tags:
      - "douyu-v*"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 用 GitHub Secret(DOUYU_COOKIE) 注入斗鱼登录 Cookie 到占位文件
      # 仓库里该文件默认是空字符串，真实凭证只存在于 Secret，不会进 git。
      # 未配置 Secret 时自动跳过注入（App 仍以匿名方式观看斗鱼）。
      - name: Inject Douyu Cookie from Secret
        run: |
          python3 - <<'PY'
          import os
          val = os.environ.get("DOUYU_COOKIE", "")
          path = "simple_live_app/lib/services/douyu_cookie_secret.dart"
          if not val:
              print("DOUYU_COOKIE 未设置，保留默认空占位（匿名观看）。")
          else:
              content = (
                  "// 本文件由 CI 从 GitHub Secret(DOUYU_COOKIE) 注入生成，请勿手动提交真实凭证。\n"
                  "const String kPrefilledDouyuCookie =\n"
                  "    " + repr(val) + ";\n"
              )
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("douyu_cookie_secret.dart written, length=", len(val))
          PY
        env:
          DOUYU_COOKIE: ${{ secrets.DOUYU_COOKIE }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Flutter pub get
        working-directory: simple_live_app
        run: flutter pub get

      - name: Build APK (split per ABI)
        working-directory: simple_live_app
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: douyu-apk
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
